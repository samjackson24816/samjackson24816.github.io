<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        #game-container {
            position: relative;
            width: 400px;
            height: 400px;
            border: 2px solid #333;
            background-color: #222;
        }
        
        #game-board {
            width: 100%;
            height: 100%;
        }
        
        #score {
            margin-top: 20px;
            font-size: 24px;
            color: #333;
        }
        
        #start-button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        #start-button:hover {
            background-color: #45a049;
        }
        
        #game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 20px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <div id="game-container">
        <canvas id="game-board"></canvas>
        <div id="game-over">
            <h2>Game Over!</h2>
            <p id="final-score">Your score: 0</p>
            <button id="restart-button">Play Again</button>
        </div>
    </div>
    <div id="score">Score: 0</div>
    <button id="start-button">Start Game</button>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Game elements
            const canvas = document.getElementById('game-board');
            const ctx = canvas.getContext('2d');
            const startButton = document.getElementById('start-button');
            const scoreDisplay = document.getElementById('score');
            const gameOverModal = document.getElementById('game-over');
            const finalScoreDisplay = document.getElementById('final-score');
            const restartButton = document.getElementById('restart-button');
            
            // Game settings
            const gridSize = 20;
            const gridWidth = canvas.parentElement.clientWidth / gridSize;
            const gridHeight = canvas.parentElement.clientHeight / gridSize;
            let snake = [];
            let food = {};
            let direction = 'right';
            let nextDirection = 'right';
            let score = 0;
            let gameInterval;
            let gameSpeed = 150;
            let gameRunning = false;
            
            // Initialize canvas size
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            
            // Initialize game
            function initGame() {
                // Reset game state
                snake = [
                    {x: 10, y: 10}, 
                    {x: 9, y: 10}, 
                    {x: 8, y: 10}
                ];
                direction = 'right';
                nextDirection = 'right';
                score = 0;
                scoreDisplay.textContent = `Score: ${score}`;
                
                // Create first food
                createFood();
                
                // Start game loop
                if (gameInterval) clearInterval(gameInterval);
                gameInterval = setInterval(gameLoop, gameSpeed);
                gameRunning = true;
                
                // Hide game over screen
                gameOverModal.style.display = 'none';
            }
            
            // Create food at random position
            function createFood() {
                food = {
                    x: Math.floor(Math.random() * gridWidth),
                    y: Math.floor(Math.random() * gridHeight)
                };
                
                // Make sure food doesn't appear on snake
                for (let i = 0; i < snake.length; i++) {
                    if (snake[i].x === food.x && snake[i].y === food.y) {
                        createFood();
                        break;
                    }
                }
            }
            
            // Game loop
            function gameLoop() {
                moveSnake();
                checkCollision();
                draw();
            }
            
            // Move snake
            function moveSnake() {
                // Update direction
                direction = nextDirection;
                
                // Calculate new head position
                const head = {x: snake[0].x, y: snake[0].y};
                
                switch (direction) {
                    case 'up':
                        head.y -= 1;
                        break;
                    case 'down':
                        head.y += 1;
                        break;
                    case 'left':
                        head.x -= 1;
                        break;
                    case 'right':
                        head.x += 1;
                        break;
                }
                
                // Add new head
                snake.unshift(head);
                
                // Check if snake eats food
                if (head.x === food.x && head.y === food.y) {
                    score += 10;
                    scoreDisplay.textContent = `Score: ${score}`;
                    createFood();
                    
                    // Increase speed slightly
                    if (gameSpeed > 50 && score % 50 === 0) {
                        clearInterval(gameInterval);
                        gameSpeed -= 10;
                        gameInterval = setInterval(gameLoop, gameSpeed);
                    }
                } else {
                    // Remove tail if no food eaten
                    snake.pop();
                }
            }
            
            // Check for collisions
            function checkCollision() {
                const head = snake[0];
                
                // Check wall collision
                if (head.x < 0 || head.x >= gridWidth || head.y < 0 || head.y >= gridHeight) {
                    gameOver();
                    return;
                }
                
                // Check self collision (start from index 1 as 0 is the head)
                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        gameOver();
                        return;
                    }
                }
            }
            
            // Game over
            function gameOver() {
                clearInterval(gameInterval);
                gameRunning = false;
                finalScoreDisplay.textContent = `Your score: ${score}`;
                gameOverModal.style.display = 'block';
            }
            
            // Draw game
            function draw() {
                // Clear canvas
                ctx.fillStyle = '#222';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // Draw snake
                for (let i = 0; i < snake.length; i++) {
                    // Head color different than body
                    if (i === 0) {
                        ctx.fillStyle = '#4CAF50';
                    } else {
                        ctx.fillStyle = '#8BC34A';
                    }
                    
                    ctx.fillRect(
                        snake[i].x * gridSize, 
                        snake[i].y * gridSize, 
                        gridSize - 1, 
                        gridSize - 1
                    );
                }
                
                // Draw food
                ctx.fillStyle = '#FF5722';
                ctx.fillRect(
                    food.x * gridSize, 
                    food.y * gridSize, 
                    gridSize - 1, 
                    gridSize - 1
                );
            }
            
            // Handle keyboard input
            document.addEventListener('keydown', (e) => {
                // Only process keys if game is running
                if (!gameRunning) return;
                
                switch (e.key) {
                    case 'ArrowUp':
                        if (direction !== 'down') nextDirection = 'up';
                        e.preventDefault();
                        break;
                    case 'ArrowDown':
                        if (direction !== 'up') nextDirection = 'down';
                        e.preventDefault();
                        break;
                    case 'ArrowLeft':
                        if (direction !== 'right') nextDirection = 'left';
                        e.preventDefault();
                        break;
                    case 'ArrowRight':
                        if (direction !== 'left') nextDirection = 'right';
                        e.preventDefault();
                        break;
                }
            });
            
            // Start button event
            startButton.addEventListener('click', () => {
                if (!gameRunning) {
                    initGame();
                    startButton.textContent = 'Restart Game';
                } else {
                    initGame();
                }
            });
            
            // Restart button event
            restartButton.addEventListener('click', () => {
                initGame();
            });
            
            // Initial draw
            draw();
        });
    </script>
</body>
</html>
