<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Square Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-color: #f0f0f0;
            overflow: hidden;
        }
        .player {
            position: absolute;
            width: 50px;
            height: 50px;
            transition: transform 0.1s ease;
        }
        .player-name {
            position: absolute;
            top: -20px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            white-space: nowrap;
        }
        #login-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            text-align: center;
            z-index: 10;
        }
        input, button {
            padding: 8px 12px;
            margin: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #player-count {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="login-container">
        <h2>Enter the Game</h2>
        <input type="text" id="player-name" placeholder="Your name" maxlength="15">
        <div>
            <input type="color" id="player-color" value="#3498db">
            <label for="player-color">Choose your color</label>
        </div>
        <button id="start-button">Start Game</button>
    </div>
    
    <div id="game-container" style="display: none;">
        <div id="player-count">Players online: 0</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Game variables
        let currentPlayerId;
        let playerName;
        let playerColor;
        let players = {};
        let keysPressed = {};
        const SPEED = 5;
        
        // Supabase setup - you'll need to replace with your own project URL and anon key
        const supabaseUrl = 'https://mnjotgnqkdasqhycyhew.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1uam90Z25xa2Rhc3FoeWN5aGV3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDA0NDc2NjMsImV4cCI6MjA1NjAyMzY2M30.HPGw4I1aR_nlOCP8_shLBS_SCdD0ZnwMKSKjISmdkDo';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);
        
        // DOM elements
        const gameContainer = document.getElementById('game-container');
        const loginContainer = document.getElementById('login-container');
        const playerNameInput = document.getElementById('player-name');
        const playerColorInput = document.getElementById('player-color');
        const startButton = document.getElementById('start-button');
        const playerCountDisplay = document.getElementById('player-count');
        
        // Start game button event listener
        startButton.addEventListener('click', startGame);
        
        // Handle player login
        async function startGame() {
            playerName = playerNameInput.value.trim() || 'Anonymous';
            playerColor = playerColorInput.value;
            
            if (playerName) {
                // Get a random start position
                const startX = Math.floor(Math.random() * (window.innerWidth - 100)) + 50;
                const startY = Math.floor(Math.random() * (window.innerHeight - 100)) + 50;
                
                // Generate a unique ID
                currentPlayerId = generateUniqueId();
                
                // Create the player in Supabase
                try {
                    await supabase
                        .from('players')
                        .insert({
                            id: currentPlayerId,
                            name: playerName,
                            color: playerColor,
                            x: startX,
                            y: startY,
                            last_updated: new Date().toISOString()
                        });
                    
                    // Hide login, show game
                    loginContainer.style.display = 'none';
                    gameContainer.style.display = 'block';
                    
                    // Set up game
                    setupGame();
                } catch (error) {
                    console.error('Error joining game:', error);
                    alert('Error joining game. Please try again.');
                }
            }
        }
        
        // Setup game mechanics and subscriptions
        function setupGame() {
            // Set up keyboard controls
            window.addEventListener('keydown', (e) => {
                keysPressed[e.key] = true;
            });
            
            window.addEventListener('keyup', (e) => {
                keysPressed[e.key] = false;
            });
            
            // Game loop - update player position and sync with Supabase
            setInterval(updatePlayerPosition, 50);
            
            // Subscribe to player changes
            subscribeToPlayers();
            
            // Set up cleanups
            setupPlayerCleanup();
            window.addEventListener('beforeunload', removePlayer);
        }
        
        // Update player position based on keys pressed
        async function updatePlayerPosition() {
            if (!currentPlayerId) return;
            
            let playerElement = document.getElementById(currentPlayerId);
            let currentX = players[currentPlayerId]?.x || 0;
            let currentY = players[currentPlayerId]?.y || 0;
            let moved = false;
            
            // Update position based on keys
            if (keysPressed['ArrowUp'] || keysPressed['w']) {
                currentY = Math.max(0, currentY - SPEED);
                moved = true;
            }
            if (keysPressed['ArrowDown'] || keysPressed['s']) {
                currentY = Math.min(window.innerHeight - 50, currentY + SPEED);
                moved = true;
            }
            if (keysPressed['ArrowLeft'] || keysPressed['a']) {
                currentX = Math.max(0, currentX - SPEED);
                moved = true;
            }
            if (keysPressed['ArrowRight'] || keysPressed['d']) {
                currentX = Math.min(window.innerWidth - 50, currentX + SPEED);
                moved = true;
            }
            
            // Only update if player moved
            if (moved) {
                players[currentPlayerId] = {
                    ...players[currentPlayerId],
                    x: currentX,
                    y: currentY
                };
                
                // Update player element position
                if (playerElement) {
                    playerElement.style.transform = `translate(${currentX}px, ${currentY}px)`;
                }
                
                // Send update to Supabase every few movements to reduce db load
                if (Math.random() < 0.3) { // ~30% chance to update each movement
                    await supabase
                        .from('players')
                        .update({
                            x: currentX,
                            y: currentY,
                            last_updated: new Date().toISOString()
                        })
                        .eq('id', currentPlayerId);
                }
            }
        }
        
        // Subscribe to player updates from Supabase
        function subscribeToPlayers() {
            // Initial fetch of all players
            supabase
                .from('players')
                .select('*')
                .then(({ data, error }) => {
                    if (error) {
                        console.error('Error fetching players:', error);
                        return;
                    }
                    
                    data.forEach(player => {
                        players[player.id] = player;
                        renderPlayer(player);
                    });
                    
                    updatePlayerCount();
                });
            
            // Subscribe to real-time updates
            const playersSubscription = supabase
                .channel('players-channel')
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'players'
                }, payload => {
                    const newPlayer = payload.new;
                    players[newPlayer.id] = newPlayer;
                    renderPlayer(newPlayer);
                    updatePlayerCount();
                })
                .on('postgres_changes', {
                    event: 'UPDATE',
                    schema: 'public',
                    table: 'players'
                }, payload => {
                    const updatedPlayer = payload.new;
                    players[updatedPlayer.id] = updatedPlayer;
                    updatePlayerPosition(updatedPlayer);
                })
                .on('postgres_changes', {
                    event: 'DELETE',
                    schema: 'public',
                    table: 'players'
                }, payload => {
                    const deletedPlayerId = payload.old.id;
                    removePlayerElement(deletedPlayerId);
                    delete players[deletedPlayerId];
                    updatePlayerCount();
                })
                .subscribe();
        }
        
        // Render a player on the screen
        function renderPlayer(player) {
            // Check if player element already exists
            let playerElement = document.getElementById(player.id);
            
            // If not, create a new player element
            if (!playerElement) {
                playerElement = document.createElement('div');
                playerElement.id = player.id;
                playerElement.className = 'player';
                playerElement.style.backgroundColor = player.color;
                
                // Add player name
                const nameElement = document.createElement('div');
                nameElement.className = 'player-name';
                nameElement.textContent = player.name;
                playerElement.appendChild(nameElement);
                
                gameContainer.appendChild(playerElement);
            }
            
            // Set position
            playerElement.style.transform = `translate(${player.x}px, ${player.y}px)`;
        }
        
        // Update a player's position on the screen
        function updatePlayerPosition(player) {
            if (player.id === currentPlayerId) return; // Don't update our own player from Supabase
            
            const playerElement = document.getElementById(player.id);
            if (playerElement) {
                playerElement.style.transform = `translate(${player.x}px, ${player.y}px)`;
            } else {
                renderPlayer(player);
            }
        }
        
        // Remove a player element from the DOM
        function removePlayerElement(playerId) {
            const playerElement = document.getElementById(playerId);
            if (playerElement) {
                playerElement.remove();
            }
        }
        
        // Remove player from the game and Supabase
        async function removePlayer() {
            if (currentPlayerId) {
                try {
                    await supabase
                        .from('players')
                        .delete()
                        .eq('id', currentPlayerId);
                } catch (error) {
                    console.error('Error removing player:', error);
                }
            }
        }
        
        // Cleanup inactive players (those who haven't updated in the last minute)
        function setupPlayerCleanup() {
            setInterval(async () => {
                const fiveMinutesAgo = new Date();
                fiveMinutesAgo.setMinutes(fiveMinutesAgo.getMinutes() - 1);
                
                try {
                    await supabase
                        .from('players')
                        .delete()
                        .lt('last_updated', fiveMinutesAgo.toISOString());
                } catch (error) {
                    console.error('Error cleaning up inactive players:', error);
                }
            }, 30000); // Run every 30 seconds
        }
        
        // Update the player count display
        function updatePlayerCount() {
            const count = Object.keys(players).length;
            playerCountDisplay.textContent = `Players online: ${count}`;
        }
        
        // Generate a random ID
        function generateUniqueId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }
    </script>
</body>
</html>
